{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Créer un compte</h1>
    <form method="post">
        <label>Nom complet
            <input type="text" name="full_name" required autofocus>
        </label>
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Mot de passe (6 caractères min.)
            <input type="password" name="password" required minlength="6">
        </label>
        <label>RIB / IBAN
            <input type="text" name="rib" placeholder="FR76 XXXX XXXX XXXX XXXX XXXX XXX" required minlength="14">
        </label>
        <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>
    <p class="muted">Déjà inscrit(e) ? <a href="{{ url_for('login') }}">Connecte-toi</a></p>
    <p class="muted small">Le tout premier compte créé sur l'application devient automatiquement trésorier.</p>
</div>
{% endblock %}
